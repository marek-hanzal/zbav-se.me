name: Check

on:
    push:
        branches-ignore:
            - main
            - dev
            - uat

concurrency:
    group: check
    cancel-in-progress: false

permissions:
    contents: read

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    NODE_OPTIONS: --max-old-space-size=1600
    VITE_CONTENT_CDN: ${{ vars.VITE_CONTENT_CDN }}
    VITE_ORIGIN: https://zbav-se.me.localhost:1355
    SERVER_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432
    SERVER_BETTER_AUTH_SECRET: ${{ secrets.SERVER_BETTER_AUTH_SECRET }}
    SERVER_GEOAPIFY_TOKEN: ${{ secrets.SERVER_GEOAPIFY_TOKEN }}
    SERVER_S3_API: ${{ vars.SERVER_S3_API }}
    SERVER_S3_KEY: ${{ secrets.SERVER_S3_KEY }}
    SERVER_S3_SECRET: ${{ secrets.SERVER_S3_SECRET }}
    SERVER_S3_BUCKET: ${{ vars.SERVER_S3_BUCKET }}
    SERVER_GITHUB: ${{ secrets.SERVER_GITHUB }}
    SERVER_HMAC_SECRET: ${{ secrets.SERVER_HMAC_SECRET }}
    SERVER_SMTP_HOST: ${{ vars.SERVER_SMTP_HOST }}
    SERVER_SMTP_PORT: ${{ vars.SERVER_SMTP_PORT }}
    SERVER_SMTP_USERNAME: ${{ vars.SERVER_SMTP_USERNAME }}
    SERVER_SMTP_PASSWORD: ${{ secrets.SERVER_SMTP_PASSWORD }}
    SERVER_SMTP_FROM: ${{ vars.SERVER_SMTP_FROM }}
    SERVER_AI_TOKEN: ${{ secrets.SERVER_AI_TOKEN }}
    SERVER_AI_SERVER_URL: ${{ vars.SERVER_AI_SERVER_URL }}
    SERVER_AI_MODEL: ${{ vars.SERVER_AI_MODEL }}

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        environment: dev
        steps:
            - uses: actions/checkout@v6.0.2

            - name: Setup Node.js
              uses: actions/setup-node@v6.3.0
              with:
                  node-version: "24"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2.2.0

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build
              run: bun run build

    lint:
        name: Lint
        runs-on: ubuntu-latest
        environment: dev
        steps:
            - uses: actions/checkout@v6.0.2

            - name: Setup Node.js
              uses: actions/setup-node@v6.3.0
              with:
                  node-version: "24"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2.2.0

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Lint
              run: bun run lint

    dc:
        name: Dependency Cruiser
        runs-on: ubuntu-latest
        environment: dev
        steps:
            - uses: actions/checkout@v6.0.2

            - name: Setup Node.js
              uses: actions/setup-node@v6.3.0
              with:
                  node-version: "24"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2.2.0

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Dependency Cruiser
              run: bun run dc

    typecheck:
        name: Typecheck
        runs-on: ubuntu-latest
        environment: dev
        steps:
            - uses: actions/checkout@v6.0.2

            - name: Setup Node.js
              uses: actions/setup-node@v6.3.0
              with:
                  node-version: "24"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2.2.0

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Typecheck
              run: bun run typecheck

    knip:
        name: Knip
        runs-on: ubuntu-latest
        environment: dev
        steps:
            - uses: actions/checkout@v6.0.2

            - name: Setup Node.js
              uses: actions/setup-node@v6.3.0
              with:
                  node-version: "24"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2.2.0

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Knip
              run: bun run knip

    vitest:
        name: Vitest
        runs-on: ubuntu-latest
        environment: dev
        steps:
            - uses: actions/checkout@v6.0.2

            - name: Setup Node.js
              uses: actions/setup-node@v6.3.0
              with:
                  node-version: "24"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2.2.0

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Test
              run: bun run test

            - name: Publish coverage summary
              if: always()
              run: |
                  node <<'EOF'
                  const fs = require("node:fs");
                  const summaryPath = "coverage/vitest/coverage-summary.json";
                  const outputPath = process.env.GITHUB_STEP_SUMMARY;

                  if (!outputPath || !fs.existsSync(summaryPath)) {
                    process.exit(0);
                  }

                  const summary = JSON.parse(fs.readFileSync(summaryPath, "utf8"));
                  const total = summary.total;

                  const lines = [
                    "## Vitest Coverage",
                    "",
                    "| Metric | Covered | Total | % |",
                    "| --- | ---: | ---: | ---: |",
                    `| Lines | ${total.lines.covered} | ${total.lines.total} | ${total.lines.pct}% |`,
                    `| Statements | ${total.statements.covered} | ${total.statements.total} | ${total.statements.pct}% |`,
                    `| Functions | ${total.functions.covered} | ${total.functions.total} | ${total.functions.pct}% |`,
                    `| Branches | ${total.branches.covered} | ${total.branches.total} | ${total.branches.pct}% |`,
                    "",
                    "Artifacts:",
                    "- `coverage/vitest/index.html`",
                    "- `coverage/vitest/lcov.info`",
                    "- `coverage/vitest/cobertura-coverage.xml`",
                    "- `coverage/vitest/coverage-summary.json`",
                    "",
                  ];

                  fs.appendFileSync(outputPath, lines.join("\n"));
                  EOF

            - name: Upload coverage artifact
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: vitest-coverage
                  if-no-files-found: ignore
                  path: coverage/vitest
    e2e:
        name: Full-Stack Test
        runs-on: ubuntu-latest
        environment: dev
        services:
            mailpit:
                image: axllent/mailpit:v1.27
                ports:
                    - 1025:1025
                    - 8025:8025
                env:
                    MP_SMTP_AUTH: mailpit:mailpit
                    MP_SMTP_AUTH_ALLOW_INSECURE: 1
        env:
            NITRO_PRESET: node_server
            SERVER_E2E: e2e
            SERVER_CRON_TOKEN: e2e-cron-token
            SERVER_MIGRATION_TOKEN: e2e-migration-token
            SERVER_SMTP_HOST: 127.0.0.1
            SERVER_SMTP_PORT: 1025
            SERVER_SMTP_USERNAME: mailpit
            SERVER_SMTP_PASSWORD: mailpit
            SERVER_SMTP_FROM: Zbavík <info@zbav-se.me>
            MAILPIT_BASE_URL: http://127.0.0.1:8025
            PORTLESS_STATE_DIR: /tmp/portless
            NODE_EXTRA_CA_CERTS: /tmp/portless/ca.pem
            SSL_CERT_FILE: /tmp/portless/ca.pem
        steps:
            - uses: actions/checkout@v6.0.2

            - name: Setup Node.js
              uses: actions/setup-node@v6.3.0
              with:
                  node-version: "24"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2.2.0

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Resolve Playwright version
              id: playwright-version
              run: |
                  VERSION=$(node -p 'require("./package.json").devDependencies["@playwright/test"]')
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Install portless
              run: bun install -g portless

            - name: Start portless proxy
              run: portless proxy start -p 1355 --https

            - name: Restore Playwright browser cache
              id: playwright-cache
              uses: actions/cache/restore@v5.0.3
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-chromium-${{ steps.playwright-version.outputs.version }}

            - name: Install Playwright browsers
              run: bunx playwright install --with-deps chromium

            - name: Save Playwright browser cache
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v5.0.3
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-chromium-${{ steps.playwright-version.outputs.version }}

            - name: Run Playwright
              run: bun run e2e

            - name: Upload Playwright artifacts
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-artifacts
                  if-no-files-found: ignore
                  path: |
                      playwright-report
                      results
