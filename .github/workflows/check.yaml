name: Check

on:
    push:
        branches-ignore:
            - main

concurrency:
    group: check
    cancel-in-progress: false

permissions:
    contents: read

env:
    #     FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    #     VITE_SERVER_API: ${{ vars.VITE_SERVER_API }}
    #     VITE_APP_ASSETS: ${{ vars.VITE_APP_ASSETS }}
    VITE_ORIGIN: ${{ vars.VITE_ORIGIN }}
    #     NODE_OPTIONS: --max-old-space-size=1300
    #     SERVER_S3_API: ${{ vars.SERVER_S3_API }}
    #     SERVER_S3_BUCKET: ${{ vars.SERVER_S3_BUCKET }}
    #     SERVER_S3_KEY: ${{ secrets.SERVER_S3_KEY }}
    #     SERVER_S3_SECRET: ${{ secrets.SERVER_S3_SECRET }}
    SERVER_BETTER_AUTH_SECRET: ${{ secrets.SERVER_BETTER_AUTH_SECRET }}
#     SERVER_GEOAPIFY_TOKEN: ${{ secrets.SERVER_GEOAPIFY_TOKEN }}
#     SERVER_JWT_SECRET: ${{ secrets.SERVER_JWT_SECRET }}
#     SERVER_CONTENT_CDN: ${{ vars.SERVER_CONTENT_CDN }}
#     SERVER_GITHUB: ${{ secrets.SERVER_GITHUB }}
#     BUNNY_HOST: ${{ vars.BUNNY_HOST }}
#     BUNNY_USER: ${{ vars.BUNNY_USER }}
#     BUNNY_TOKEN: ${{ secrets.BUNNY_TOKEN }}
#     NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
#     NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}

jobs:
    check:
        name: Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6.0.2

            - name: Setup Node.js
              uses: actions/setup-node@v6.3.0
              with:
                  node-version: "24"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2.2.0

            - name: Install dependencies
              run: bun install

            - name: Check
              run: bun run workflow:check

    test:
        name: Test
        runs-on: ubuntu-latest
        environment: staging
        steps:
            - uses: actions/checkout@v6.0.2

            - name: Setup Node.js
              uses: actions/setup-node@v6.3.0
              with:
                  node-version: "24"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2.2.0

            - name: Install dependencies
              run: bun install

            - name: Test
              run: bun run test
