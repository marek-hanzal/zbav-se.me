name: Check

on:
    push:
        branches-ignore:
            - main
            - staging

concurrency:
    group: check
    cancel-in-progress: false

permissions:
    contents: read

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    VITE_ORIGIN: https://zbav-se.me.localhost:1355
    VITE_SERVER_API: https://api.zbav-se.me.localhost:1355
    NODE_OPTIONS: --max-old-space-size=1300
    SERVER_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432
    SERVER_BETTER_AUTH_SECRET: ${{ secrets.SERVER_BETTER_AUTH_SECRET }}
    SERVER_GEOAPIFY_TOKEN: ${{ secrets.SERVER_GEOAPIFY_TOKEN }}

jobs:
    check:
        name: Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6.0.2

            - name: Setup Node.js
              uses: actions/setup-node@v6.3.0
              with:
                  node-version: "24"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2.2.0

            - name: Install dependencies
              run: bun install

            - name: Check
              run: bun run workflow:check

    test:
        name: Test
        runs-on: ubuntu-latest
        environment: staging
        steps:
            - uses: actions/checkout@v6.0.2

            - name: Setup Node.js
              uses: actions/setup-node@v6.3.0
              with:
                  node-version: "24"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2.2.0

            - name: Install dependencies
              run: bun install

            - name: Test
              run: bun run test

    e2e:
        name: e2e
        runs-on: ubuntu-latest
        environment: staging
        env:
            E2E_REUSE_EXISTING_SERVER: "1"
        steps:
            - uses: actions/checkout@v6.0.2

            - name: Setup Node.js
              uses: actions/setup-node@v6.3.0
              with:
                  node-version: "24"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2.2.0

            - name: Install dependencies
              run: bun install

            - name: Install portless
              run: bun install -g portless

            - name: Start and verify portless proxy
              run: |
                  portless proxy start --https
                  portless list
                  curl -skI https://127.0.0.1:1355 >/dev/null

            - name: Start app and server for debug
              run: |
                  set -euo pipefail

                  mkdir -p "$RUNNER_TEMP/e2e-debug"

                  nohup bun run --cwd ./apps/server e2e >"$RUNNER_TEMP/e2e-debug/server.log" 2>&1 &
                  server_pid=$!
                  nohup bun run --cwd ./apps/app e2e >"$RUNNER_TEMP/e2e-debug/app.log" 2>&1 &
                  app_pid=$!

                  echo "server_pid=$server_pid"
                  echo "app_pid=$app_pid"

                  for _ in $(seq 1 60); do
                      routes_output="$(portless list)"

                      if curl -skI https://api.zbav-se.me.localhost:1355/api/public/health >/dev/null && curl -skI https://zbav-se.me.localhost:1355 >/dev/null && ! grep -q "No active routes." <<<"$routes_output"; then
                          echo "Frontend and backend are reachable through portless"
                          echo "$routes_output"
                          exit 0
                      fi

                      if ! kill -0 "$server_pid" 2>/dev/null; then
                          echo "::group::server.log"
                          cat "$RUNNER_TEMP/e2e-debug/server.log"
                          echo "::endgroup::"
                          exit 1
                      fi

                      if ! kill -0 "$app_pid" 2>/dev/null; then
                          echo "::group::app.log"
                          cat "$RUNNER_TEMP/e2e-debug/app.log"
                          echo "::endgroup::"
                          exit 1
                      fi

                      echo "$routes_output"
                      sleep 1
                  done

                  echo "::group::portless list"
                  portless list
                  echo "::endgroup::"

                  echo "::group::server.log"
                  cat "$RUNNER_TEMP/e2e-debug/server.log"
                  echo "::endgroup::"

                  echo "::group::app.log"
                  cat "$RUNNER_TEMP/e2e-debug/app.log"
                  echo "::endgroup::"

                  exit 1

            - name: Install Playwright browsers
              run: |
                  cd apps/e2e
                  bunx playwright install --with-deps chromium

            - name: e2e
              run: bun run e2e

            - name: Upload Playwright artifacts
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-artifacts
                  if-no-files-found: ignore
                  path: |
                      apps/e2e/playwright-report
                      apps/e2e/results
