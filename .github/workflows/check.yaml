name: Check

on:
    push:
        branches-ignore:
            - main
            - staging

concurrency:
    group: check
    cancel-in-progress: false

permissions:
    contents: read

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    VITE_ORIGIN: https://zbav-se.me.localhost:1355
    VITE_SERVER_API: https://api.zbav-se.me.localhost:1355
    NODE_OPTIONS: --max-old-space-size=1300
    SERVER_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432
    SERVER_BETTER_AUTH_SECRET: ${{ secrets.SERVER_BETTER_AUTH_SECRET }}
    SERVER_GEOAPIFY_TOKEN: ${{ secrets.SERVER_GEOAPIFY_TOKEN }}

jobs:
    check:
        name: Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6.0.2

            - name: Setup Node.js
              uses: actions/setup-node@v6.3.0
              with:
                  node-version: "24"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2.2.0

            - name: Install dependencies
              run: bun install

            - name: Check
              run: bun run workflow:check

    test:
        name: Test
        runs-on: ubuntu-latest
        environment: staging
        steps:
            - uses: actions/checkout@v6.0.2

            - name: Setup Node.js
              uses: actions/setup-node@v6.3.0
              with:
                  node-version: "24"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2.2.0

            - name: Install dependencies
              run: bun install

            - name: Test
              run: bun run test

    e2e:
        name: e2e
        runs-on: ubuntu-latest
        environment: staging
        env:
            PORTLESS_STATE_DIR: ${{ runner.temp }}/portless
            NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/portless/ca.pem
            SSL_CERT_FILE: ${{ runner.temp }}/portless/ca.pem
        steps:
            - uses: actions/checkout@v6.0.2

            - name: Setup Node.js
              uses: actions/setup-node@v6.3.0
              with:
                  node-version: "24"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2.2.0

            - name: Install dependencies
              run: bun install

            - name: Install portless
              run: bun install -g portless

            - name: Start portless proxy
              run: |
                  set -euo pipefail

                  mkdir -p "$PORTLESS_STATE_DIR"
                  portless proxy start --https

            - name: Install Playwright browsers
              run: bunx playwright install --with-deps chromium

            - name: Run Playwright
              run: bun run e2e

            - name: Upload Playwright artifacts
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-artifacts
                  if-no-files-found: ignore
                  path: |
                      apps/e2e/playwright-report
                      apps/e2e/results
