name: Check

on:
    push:
        branches-ignore:
            - main
            - staging

concurrency:
    group: check
    cancel-in-progress: false

permissions:
    contents: read

env:
    VITE_SERVER_API: ${{ vars.VITE_SERVER_API }}
    VITE_ORIGIN: ${{ vars.VITE_ORIGIN }}
    NODE_OPTIONS: --max-old-space-size=1300
    SERVER_BETTER_AUTH_SECRET: ${{ secrets.SERVER_BETTER_AUTH_SECRET }}
    SERVER_GEOAPIFY_TOKEN: ${{ secrets.SERVER_GEOAPIFY_TOKEN }}

jobs:
    check:
        name: Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6.0.2

            - name: Setup Node.js
              uses: actions/setup-node@v6.3.0
              with:
                  node-version: "24"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2.2.0

            - name: Install dependencies
              run: bun install

            - name: Check
              run: bun run workflow:check

    test:
        name: Test
        runs-on: ubuntu-latest
        environment: staging
        steps:
            - uses: actions/checkout@v6.0.2

            - name: Setup Node.js
              uses: actions/setup-node@v6.3.0
              with:
                  node-version: "24"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2.2.0

            - name: Install dependencies
              run: bun install

            - name: Test
              run: bun run test
