[tools]
node = "24.21.0"
argc = "1.24.0"
github-cli = "2.102.0"
terraform = "1.16.5"
jq = "1.8.2"
sops = "3.13.3"
age = "1.3.2"
"npm:@bunny.net/cli" = "0.19.0"
"npm:dependency-cruiser" = { version = "18.5.0", npm_args = "typescript@6.0.3" }
"npm:portless" = "0.7.2"
"npm:vercel" = "50.44.0"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[settings]
# Install Dependency Cruiser and its compatible compiler API into the same tool prefix.
npm.package_manager = "npm"
