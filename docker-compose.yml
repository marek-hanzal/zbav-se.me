services:
    postgres:
        image: nhost/postgres:17-20260320-1
        container_name: zbav-se-postgres
        restart: always
        ports:
            - "5432:5432"
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: zbav_se_me
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 5
    mailpit:
        image: axllent/mailpit:v1.27
        container_name: zbav-se-mailpit
        restart: always
        ports:
            - "1025:1025"
            - "8025:8025"
        environment:
            MP_SMTP_AUTH: mailpit:mailpit
            MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
    postgres_data:
